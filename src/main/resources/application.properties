# Database configuration
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://host:3306/database_name?useSSL=false
jdbc.user=username
jdbc.password=password

# Schema patterns
schema.includePattern=((?i)^(ck_?(transformer.*|target.*|sales.*|enrichment.*|validation.*|metadata.*|grn_info|.*profile.*|location|hierarchy.*|sales.*|category_info|auth_role|supplier_metadata|generic.*|delivery_pjp|customer_account|score_details|redeem_activity|product.*|discount.*|stock.*|generic_object|division|outlet_metadata|integration_history|division_roles|scheme.*|channel.*|division.*))|(ck_outlet_details_?(hierarchy.*)?|(ck_user_?(.*parent|roles|designation)?)))

schema.excludePattern=

# Input schema and target package
input.schema=ck_demounnati
bootstrap.servers=164.52.202.184:9092
target.package=com.salescode.dim.jooq.generated
target.directory=target/generated-sources/jooq
group.id=dataintegration-local

lob=ck_demounnati
env=demo

entities=OutletDetails,OutletMetadata,Targets,GenericEntity

# Topic name for the input data ${lob}-${input.topic}; From this topic, it will be bifurcated to different topics based on the entity then consumed
# ${lob}-${input.topic}-${entity} e.g. ckunnatiuat-dataintegration-OutletDetails
# For failures, it will be pushed to ${lob}-${input.topic}-dlq e.g. dataintegration-ckunnatiuat-failure
# For events, it will be pushed to ${lob}-${input.topic}-events e.g. dataintegration-ckunnatiuat-events
input.topic=dataintegration
failure.topic=dataintegration-failure
event.topic=dataintegration-event
redisUrl=redis://localhost:6379
cacheClustered=false
INSIGHTS_INTEGRATION_IDLE_EVICTION_TTL_MINUTES=10
insights.topic=file-progress-updates-1
insights.enabled=true
publish.success.enabled=true
success.topic=int-success-streams

