spring.application.name=dataintegration

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=integ-lob-entity-group
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.session.timeout.ms=60000
spring.kafka.producer.transaction-id-prefix=tx-
spring.kafka.listener.backoff.initial-interval=1000
spring.kafka.listener.backoff.max-interval=10000
spring.kafka.listener.concurrency=3
spring.kafka.listener.dlt.publish=true
spring.kafka.listener.retry-attempts=3
spring.kafka.listener.idle-event-interval=300000


# Thread Pool Configuration
thread.pool.core.size=10
thread.pool.max.size=50
thread.pool.queue.capacity=100

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/salescode_db
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JOOQ Configuration
spring.jooq.sql-dialect=MYSQL

# Custom Settings
batch.size=100
parallel.inserts.limit=10
idle.timeout.minutes=5
auto.shutdown=true

# Resilience properties
resilience4j.retry.dbInsert.max-attempts=2
resilience4j.retry.dbInsert.wait-duration=500ms
