# Database configuration
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://host:3306/database_name?useSSL=false
jdbc.user=username
jdbc.password=password

# Schema patterns
schema.includePattern=((?i)^(ck_?(transformer.*|enrichment.*|validation.*|metadata.*|.*profile.*|location|hierarchy.*|auth_role|supplier_metadata|generic.*|customer_account|channel_hierarchy_metadata|division|integration_history|division_roles))|(ck_outlet_details_?(hierarchy.*)?|(ck_user_?(.*parent|roles|designation)?)))
schema.excludePattern=

# Input schema and target package
input.schema=database_name
bootstrap.servers=164.52.202.184:9092
target.package=com.salescode.dim.jooq.generated
target.directory=target/generated-sources/jooqbootstrap.servers=164.52.202.184:9092
group.id=dataintegration-local
lob=ckunnatiuat

entities=OutletDetails
input.topic=flink-test
output.topic.prefix=flink-test
failure.topic=flink-test-dlq
output.topic=flink-test-out