# Docker Compose Configuration
#
# Available Services:
#
# 1. PostgreSQL
#    - Database server on port 5432
#    - Connection: localhost:5432
#    - Username: postgres
#    - Password: postgres
#    - Database: dis_insights
#    - No built-in UI (use a tool like pgAdmin or DBeaver)
#
# 2. Kafka
#    - Message broker on port 9092
#    - Bootstrap server: localhost:9092
#    - Internal communication on port 29092
#
#    Kafka UI
#    - Web interface for Kafka on port 9000
#    - Access via browser: http://localhost:9000
#    - Manage topics, consumers, and monitor Kafka
#
# 3. Zookeeper
#    - Kafka dependency on port 2181
#
# 4. Redis Stack
#    - Redis database on port 6379
#    - Redis Insight UI on port 8001
#    - Access UI via browser: http://localhost:8001
#    - Monitor Redis data, run queries, and visualize data

version: "3"

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dis_insights
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - backend

  # Kafka Compose File (kafka-compose.yml)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 120000
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 500M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 250M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 250M

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 500M

networks:
  backend:
    driver: bridge
  postgres-network:
    driver: bridge

volumes:
  postgres:
  redis-data:
