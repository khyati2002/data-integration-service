# Define the active profiles, default is dev,h2 or dev,postgres depending on the environment.
spring:
  application:
    name: insights

  # Set the active profiles, default to dev,h2,debug
  profiles:
    active: postgres,dev,info,kafka  # Active profiles to be loaded together

server:
  port: 8081

---

# Configuration for 'dev' profile
spring:
  config:
    activate:
      on-profile: dev

  devtools:
    add-properties: true

  # Development-specific settings
  jpa:
    hibernate:
      ddl-auto: update

  datasource:
    url: jdbc:postgresql://localhost:5432/dis_insights
    username: postgres
    password: postgres

  kafka:
    bootstrap-servers: 164.52.202.184:9092

cache:
  redisUrl: redis://localhost:6379

application:
  environment: dev

app:
  active-environments:
    - dev

file:
  progress:
    update:
      topic: file-progress-updates-test
      failure:
        topic: file-progress-updates-failed

